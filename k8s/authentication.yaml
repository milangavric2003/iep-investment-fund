apiVersion: apps/v1
kind: Deployment
metadata:
  name: authentication
  namespace: iep-investment-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: authentication
  template:
    metadata:
      labels:
        app: authentication
    spec:
      containers:
        - name: authentication
          image: iep-authentication:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: DATABASE_URL
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: DATABASE_SERVICE
            - name: DATABASE_USERNAME
              value: "root"
            - name: DATABASE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: MYSQL_ROOT_PASSWORD
            - name: DATABASE_NAME
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: DATABASE_NAME
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 15
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /
              port: 5000
            initialDelaySeconds: 30
            periodSeconds: 10
          startupProbe:
            httpGet:
              path: /
              port: 5000
            failureThreshold: 30
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: authentication
  namespace: iep-investment-fund
spec:
  type: NodePort
  selector:
    app: authentication
  ports:
    - port: 5000
      targetPort: 5000
      nodePort: 30050
