apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee
  namespace: iep-investment-fund
spec:
  replicas: 3
  selector:
    matchLabels:
      app: employee
  template:
    metadata:
      labels:
        app: employee
    spec:
      containers:
        - name: employee
          image: iep-employee:k8s
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5001
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: MONGO_URL
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: MONGO_DATABASE
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: REDIS_SERVICE
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: REDIS_DB
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5001
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: employee
  namespace: iep-investment-fund
spec:
  type: NodePort
  selector:
    app: employee
  ports:
    - port: 5001
      targetPort: 5001
      nodePort: 30051
