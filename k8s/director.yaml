apiVersion: apps/v1
kind: Deployment
metadata:
  name: director
  namespace: iep-investment-fund
spec:
  replicas: 1
  selector:
    matchLabels:
      app: director
  template:
    metadata:
      labels:
        app: director
    spec:
      containers:
        - name: director
          image: iep-director:k8s-20260908
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5002
          env:
            - name: MONGO_URL
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: MONGO_URL
            - name: MONGO_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: MONGO_DATABASE
            - name: REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: REDIS_SERVICE
            - name: REDIS_PORT
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: REDIS_PORT
            - name: REDIS_DB
              valueFrom:
                configMapKeyRef:
                  name: iep-config
                  key: REDIS_DB
            - name: JWT_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: iep-secrets
                  key: JWT_SECRET_KEY
          readinessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            tcpSocket:
              port: 5002
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: director
  namespace: iep-investment-fund
spec:
  type: NodePort
  selector:
    app: director
  ports:
    - port: 5002
      targetPort: 5002
      nodePort: 30052
