apiVersion: v1
kind: Secret
metadata:
  name: iep-secrets
  namespace: iep-investment-fund
type: Opaque
stringData:
  # Development-only values for the local defense cluster.
  MYSQL_ROOT_PASSWORD: "root"
  MONGO_ROOT_USERNAME: "root"
  MONGO_ROOT_PASSWORD: "example"
  MONGO_URL: "mongodb://root:example@mongodb:27017/?authSource=admin"
  JWT_SECRET_KEY: "development-secret-key-with-at-least-32-bytes"
